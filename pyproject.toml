[project]
name = "edgar-agentic-research"
version = "0.1.0"
description = "A researcher/verifier multi-agent system that researches SEC EDGAR filings using local Ollama models."
requires-python = ">= 3.10"
dependencies = [
    "ollama==0.4.7",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
edgar-research = "main:main"
